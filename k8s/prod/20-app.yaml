apiVersion: v1
kind: Service
metadata:
  name: dataops-app
  namespace: prod
  labels:
    app: dataops-app
spec:
  selector:
    app: dataops-app
  ports:
    - name: http
      port: 80
      targetPort: 8020
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataops-app
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dataops-app
  template:
    metadata:
      labels:
        app: dataops-app
    spec:
      containers:
        - name: app
          image: sniqi/dataops-demo:latest
          ports:
            - containerPort: 8020
          env:
            - name: ENV
              value: prod
            - name: DB_HOST
              value: postgres
            - name: DB_USER
              value: dataops
            - name: DB_NAME
              value: dataopsdb
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
          readinessProbe:
            httpGet:
              path: /health
              port: 8020
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8020
            initialDelaySeconds: 10
            periodSeconds: 20
