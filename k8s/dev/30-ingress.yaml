apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dataops-app
  namespace: dev
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dev.dataops.local
      secretName: dataops-tls
  rules:
    - host: dev.dataops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dataops-app
                port:
                  number: 80
