groups:
  - name: app_alerts
    rules:
      - alert: InstanceDown
        expr: up{job="fastapi_app"} == 0
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} down"
          description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 10 seconds."

      - alert: HighRequestRate
        expr: rate(http_requests_total[1m]) > 5
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "High request rate on {{ $labels.instance }}"
          description: "Request rate is above 5 req/s (current value: {{ $value }})"
