global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - "dataops-alertmanager:9093"

scrape_configs:
  - job_name: 'fastapi_app'
    static_configs:
      - targets: ['dataops-app:8020']
