name: CI Pipeline

on:
  push:
    branches:
      - dev
      - staging
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/dataops-demo
          tags: |
            # Dev Branch -> dev-latest
            type=raw,value=dev-latest,enable=${{ github.ref == 'refs/heads/dev' }}
            # Staging Branch -> staging-latest & sha
            type=raw,value=staging-latest,enable=${{ github.ref == 'refs/heads/staging' }}
            type=sha,prefix=staging-,enable=${{ github.ref == 'refs/heads/staging' }}
            # Main Branch -> latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
