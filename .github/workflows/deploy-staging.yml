name: Deploy (staging)

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy (e.g. sha-abcdef1). Leave empty to use sha-<current commit>."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_REGION: eu-west-3
      EKS_CLUSTER_NAME: dataops-eks
      K8S_NAMESPACE: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Select image tag
        id: img
        shell: bash
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply manifests (staging) with exact image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ steps.img.outputs.tag }}
        run: |
          kubectl apply -f k8s/staging/00-namespace.yaml
          kubectl -n "$K8S_NAMESPACE" apply -f k8s/staging/10-postgres.yaml
          sed -E "s#^(\s*image:) .*#\1 $DOCKER_USERNAME/dataops-demo:$IMAGE_TAG#" k8s/staging/20-app.yaml | kubectl -n "$K8S_NAMESPACE" apply -f -
          kubectl -n "$K8S_NAMESPACE" apply -f k8s/staging/30-ingress.yaml

      - name: Wait for rollout
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/dataops-app --timeout=5m
