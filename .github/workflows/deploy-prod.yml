name: Deploy (prod)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy (recommended: sha-abcdef1 from a tested staging build)"
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_REGION: eu-west-3
      EKS_CLUSTER_NAME: dataops-eks
      K8S_NAMESPACE: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Apply manifests (prod) with exact image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          kubectl apply -f k8s/prod/00-namespace.yaml
          kubectl -n "$K8S_NAMESPACE" apply -f k8s/prod/10-postgres.yaml
          sed -E "s#^(\s*image:) .*#\1 $DOCKER_USERNAME/dataops-demo:$IMAGE_TAG#" k8s/prod/20-app.yaml | kubectl -n "$K8S_NAMESPACE" apply -f -
          kubectl -n "$K8S_NAMESPACE" apply -f k8s/prod/30-ingress.yaml

      - name: Wait for rollout
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/dataops-app --timeout=5m
